name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Gate 1 - Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/pint --test

  static:
    name: Gate 2 - Static Analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    name: Gate 3 - Feature Tests (PostgreSQL + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: none

      - name: Prepare roles & database (mirror phpunit.xml)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE awareness_dev LOGIN PASSWORD 'LocalDevOnly!123' CREATEDB;"
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE awareness_app LOGIN PASSWORD 'AppRuntime!123' NOBYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE awareness_testing OWNER awareness_dev;"

      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Migrate sebagai owner tabel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: awareness_testing
          DB_USERNAME: awareness_dev
          DB_PASSWORD: LocalDevOnly!123
        run: php artisan migrate --force

      - name: Grant runtime role (termasuk tabel yang dibuat kemudian)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d awareness_testing -c "GRANT USAGE ON SCHEMA public TO awareness_app;"
          psql -h 127.0.0.1 -U postgres -d awareness_testing -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO awareness_app;"
          psql -h 127.0.0.1 -U postgres -d awareness_testing -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO awareness_app;"
          psql -h 127.0.0.1 -U postgres -d awareness_testing -c "ALTER DEFAULT PRIVILEGES FOR ROLE awareness_dev IN SCHEMA public GRANT ALL ON TABLES TO awareness_app;"
          psql -h 127.0.0.1 -U postgres -d awareness_testing -c "ALTER DEFAULT PRIVILEGES FOR ROLE awareness_dev IN SCHEMA public GRANT ALL ON SEQUENCES TO awareness_app;"

      - name: Pest suite
        run: php artisan test